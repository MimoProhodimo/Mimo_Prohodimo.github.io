<h1>Aboba</h1>
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простая галерея</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        /* Сетка галереи */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            height: 200px;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Лайтбокс (модальное окно) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 5px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }

        .close-btn:hover {
            color: #ccc;
        }

        /* Стрелки навигации */
        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            transition: color 0.3s;
        }

        .prev:hover, .next:hover {
            color: #ccc;
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        /* Счётчик */
        .counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Моя галерея</h1>

    <div class="gallery">
        <div class="gallery-item" onclick="openLightbox(0)">
            <img src="https://picsum.photos/400/300?random=1" alt="Фото 1">
        </div>
        <div class="gallery-item" onclick="openLightbox(1)">
            <img src="https://picsum.photos/400/300?random=2" alt="Фото 2">
        </div>
        <div class="gallery-item" onclick="openLightbox(2)">
            <img src="https://picsum.photos/400/300?random=3" alt="Фото 3">
        </div>
        <div class="gallery-item" onclick="openLightbox(3)">
            <img src="https://picsum.photos/400/300?random=4" alt="Фото 4">
        </div>
        <div class="gallery-item" onclick="openLightbox(4)">
            <img src="https://picsum.photos/400/300?random=5" alt="Фото 5">
        </div>
        <div class="gallery-item" onclick="openLightbox(5)">
            <img src="https://picsum.photos/400/300?random=6" alt="Фото 6">
        </div>
    </div>

    <!-- Лайтбокс -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <span class="prev" onclick="changeImage(-1)">&#10094;</span>
        <span class="next" onclick="changeImage(1)">&#10095;</span>
        <img src="" alt="" id="lightbox-img">
        <div class="counter" id="counter"></div>
    </div>

    <script>
        // Массив с изображениями
        const images = [
            'https://picsum.photos/800/600?random=1',
            'https://picsum.photos/800/600?random=2',
            'https://picsum.photos/800/600?random=3',
            'https://picsum.photos/800/600?random=4',
            'https://picsum.photos/800/600?random=5',
            'https://picsum.photos/800/600?random=6'
        ];

        let currentIndex = 0;
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const counter = document.getElementById('counter');

        // Открыть лайтбокс
        function openLightbox(index) {
            currentIndex = index;
            updateImage();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Запретить прокрутку
        }

        // Закрыть лайтбокс
        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto'; // Вернуть прокрутку
        }

        // Сменить изображение
        function changeImage(direction) {
            currentIndex += direction;

            // Циклический переход
            if (currentIndex >= images.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }

            updateImage();
        }

        // Обновить изображение в лайтбоксе
        function updateImage() {
            lightboxImg.src = images[currentIndex];
            counter.textContent = `${currentIndex + 1} / ${images.length}`;
        }

        // Закрытие по клику вне изображения
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Управление с клавиатуры
        document.addEventListener('keydown', function(e) {
            if (!lightbox.classList.contains('active')) return;

            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                changeImage(-1);
            } else if (e.key === 'ArrowRight') {
                changeImage(1);
            }
        });
    </script>

</body>
</html>
